services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "127.0.0.1:9119:9119"      # solo accesible desde tu PC
    environment:
      - HERMES_UID=1000
      - HERMES_GID=1000
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=marco
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASH_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/opt/data
      - ./workspace:/workspace
